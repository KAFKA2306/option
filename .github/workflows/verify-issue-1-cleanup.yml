name: Verify issue 1 and cleanup branches
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-issue-1-cleanup.yml]
permissions:
  contents: write
jobs:
  verify-and-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install focused calculation-test dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy matplotlib seaborn scikit-learn japanize-matplotlib python-binance
      - name: Verify contract-aware basis calculations
        run: python -m unittest discover -s tests -p 'test_contract_analysis.py' -v
      - name: Delete merged work branches
        run: |
          for branch in agent/fix-contract-aware-basis ops/finalize-issue-1 ops/fix-issue-1-finalizer; do git push origin --delete "$branch" || true; done
      - name: Remove one-time workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git checkout -B main origin/main
          git rm .github/workflows/verify-issue-1-cleanup.yml
          git commit -m 'chore: remove issue 1 verification workflow [skip ci]'
          git push origin HEAD:main
