name: Verify issue 1 and cleanup branches
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-issue-1-cleanup.yml]
permissions:
  contents: write
jobs:
  verify-and-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install focused calculation-test dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy matplotlib seaborn scikit-learn python-binance
      - name: Run tests and build audit evidence
        run: |
          set +e
          python -m unittest discover -s tests -p 'test_contract_analysis.py' -v > /tmp/issue-1-test.log 2>&1
          status=$?
          set -e
          cat /tmp/issue-1-test.log
          STATUS="$status" python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          log = Path('/tmp/issue-1-test.log').read_text(encoding='utf-8', errors='replace')
          payload = {
              'schema_version': 1,
              'issue': 1,
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'command': "python -m unittest discover -s tests -p 'test_contract_analysis.py' -v",
              'exit_code': int(os.environ['STATUS']),
              'status': 'passed' if os.environ['STATUS'] == '0' else 'failed',
              'log': log[-12000:],
          }
          Path('/tmp/issue-1-verification.json').write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Publish audit evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p audit
          cp /tmp/issue-1-verification.json audit/issue-1-verification.json
          git add audit/issue-1-verification.json
          git commit -m 'test: record issue 1 verification evidence [skip ci]' || true
          git push origin HEAD:main
      - name: Require passing evidence
        run: python -c "import json,sys; data=json.load(open('audit/issue-1-verification.json')); sys.exit(0 if data['status']=='passed' else 1)"
      - name: Delete merged work branches
        run: |
          for branch in agent/fix-contract-aware-basis ops/finalize-issue-1 ops/fix-issue-1-finalizer ops/diagnose-issue-1-finalizer agent/fix-python312-plot-localization; do git push origin --delete "$branch" || true; done
      - name: Remove one-time workflow
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git rm .github/workflows/verify-issue-1-cleanup.yml
          git commit -m 'chore: remove issue 1 verification workflow [skip ci]'
          git push origin HEAD:main
