name: Finalize issue 11 and cleanup branches

on:
  push:
    branches: [main]
    paths: [.github/workflows/issue-11-finalize.yml]

permissions:
  contents: write

jobs:
  verify-and-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install focused regression dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy matplotlib seaborn scikit-learn
      - name: Verify existing and browser scenario contracts
        run: PYTHONPATH=src python -m unittest tests.test_contract_analysis tests.test_scenario_core -v
      - name: Delete merged and superseded work branches
        run: |
          for branch in agent/japanese-readme feat/issue-9-carry-monitor feat/issue-11-pyodide-scenario-core; do
            git push origin --delete "$branch" || true
          done
      - name: Remove one-time workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git checkout -B main origin/main
          git rm .github/workflows/issue-11-finalize.yml
          git commit -m 'chore: remove issue 11 finalizer [skip ci]'
          git push origin HEAD:main
